[package]
name = "opfelmusig"
version = "0.1.0"
description = "An alternative Apple Music client"
authors = ["waradu"]
license = "MIT"
repository = "waradu/opfelmusig"
edition = "2021"
rust-version = "1.88"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
cc = "1"

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-aac", "symphonia-isomp4", "mp3"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-util = "0.7"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
time = { version = "0.3", features = ["formatting", "macros"] }
tauri = { version = "2.12", features = ["image-png", "macos-private-api", "tray-icon", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-stronghold = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-prevent-default = "6"

[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.rust-argon2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

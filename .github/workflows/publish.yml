name: "publish"

on:
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "macos"
            runner: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - os: "linux"
            runner: "ubuntu-22.04"
            args: ""
          - os: "windows"
            runner: "windows-latest"
            args: ""

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: install Linux dependencies
        if: matrix.os == 'linux'
        background: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libdbus-1-dev

      - parallel:
          - uses: oven-sh/setup-bun@v2

          - name: setup node
            uses: actions/setup-node@v7
            with:
              node-version: lts/*

          - name: install Rust stable
            uses: dtolnay/rust-toolchain@stable
            with:
              targets: ${{ matrix.os == 'macos' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        background: true
        with:
          workspaces: "./src-tauri -> target"
          cache-bin: "false"
          cache-on-failure: "true"

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-

      - name: install frontend dependencies
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: bun ci

      - name: Set app version
        shell: "node {0}"
        run: |
          const fs = require("node:fs")
          const configPath = "src-tauri/tauri.conf.json"
          const config = JSON.parse(fs.readFileSync(configPath, "utf8"))
          const [major, minor] = config.version.split(".").map(Number)
          const runNumber = Number(process.env.GITHUB_RUN_NUMBER)

          if (!Number.isSafeInteger(runNumber) || runNumber > 65535) {
            throw new Error("Workflow run number exceeds the MSI version limit.")
          }

          config.version = `${major}.${minor}.${runNumber}`
          fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`)

      - name: Wait for build dependencies
        wait-all:

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: app-v__VERSION__
          releaseName: "App v__VERSION__"
          releaseBody: "There may or may not be a changelog for v__VERSION__. Check the [CHANGELOG](https://github.com/opfelmusig/app/blob/main/CHANGELOG.md)."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
